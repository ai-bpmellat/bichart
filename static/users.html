<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>مدیریت کاربران و سطوح دسترسی — Rayamate</title>
<link rel="icon" type="image/png" sizes="512x512" href="/static/favicon-512.png" />
<link rel="icon" type="image/png" sizes="192x192" href="/static/favicon-192.png" />
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16.png" />
<link rel="apple-touch-icon" sizes="192x192" href="/static/favicon-192.png" />
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css" />
<style>
  body.users-page {
    font-family: 'Vazirmatn', var(--font-rtl), sans-serif;
    background: #f4f8f6;
    margin: 0;
    min-height: 100vh;
  }
  .users-shell {
    max-width: 1180px;
    margin: 0 auto;
    padding: 24px 18px 40px;
  }
  .users-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .users-top h1 {
    margin: 0;
    font-size: 1.45rem;
    color: #0f2a1f;
  }
  .users-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .users-card {
    background: #fff;
    border: 1px solid rgba(5,150,105,0.14);
    border-radius: 18px;
    box-shadow: 0 16px 40px rgba(5,150,105,0.08);
    padding: 18px;
  }
  .users-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.9rem;
  }
  .users-table th, .users-table td {
    text-align: right;
    padding: 12px 10px;
    border-bottom: 1px solid rgba(5,150,105,0.1);
  }
  html[dir="ltr"] .users-table th,
  html[dir="ltr"] .users-table td {
    text-align: left;
  }
  html[dir="ltr"] .modal-actions {
    justify-content: flex-end;
  }
  .users-table th {
    color: #047857;
    font-size: 0.82rem;
    font-weight: 700;
    white-space: nowrap;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 0.76rem;
    font-weight: 700;
  }
  .badge-admin { background: rgba(5,150,105,0.14); color: #047857; }
  .badge-user { background: rgba(15,42,31,0.06); color: #4a6b5e; }
  .badge-tier1 { background: rgba(217,119,6,0.14); color: #b45309; }
  .badge-tier2 { background: rgba(37,99,235,0.1); color: #1d4ed8; }
  .badge-tier3 { background: rgba(107,114,128,0.14); color: #4b5563; }
  .badge-premium { background: rgba(217,119,6,0.14); color: #b45309; }
  .badge-off { background: rgba(161,61,47,0.1); color: #a13d2f; }
  .badge-on { background: rgba(5,150,105,0.12); color: #047857; }
  .usage-pill {
    font-family: monospace;
    font-size: 0.82rem;
    padding: 2px 8px;
    border-radius: 6px;
    background: #f1f5f3;
    color: #2c5545;
  }
  .row-btns { display: flex; gap: 6px; flex-wrap: wrap; }
  .ghost-btn.tiny, .primary-btn.tiny {
    width: auto;
    padding: 6px 10px;
    font-size: 0.8rem;
    border-radius: 10px;
  }
  .primary-btn.tiny { background: #059669; color: #fff; border: none; cursor: pointer; }
  .ghost-btn.tiny.danger { color: #a13d2f; border-color: rgba(161,61,47,0.3); }
  .modal-back {
    position: fixed; inset: 0;
    background: rgba(15,42,31,0.38);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 16px;
  }
  .modal-back.open { display: flex; }
  .modal {
    width: min(520px, 100%);
    background: #fff;
    border-radius: 20px;
    padding: 24px;
    border: 1px solid rgba(5,150,105,0.14);
    box-shadow: 0 24px 50px rgba(0,0,0,0.12);
  }
  .modal h2 { margin: 0 0 14px; font-size: 1.18rem; color: #0f2a1f; }
  .modal label {
    display: block;
    font-size: 0.84rem;
    font-weight: 600;
    color: #315749;
    margin: 10px 0 5px;
  }
  .modal input, .modal select {
    width: 100%;
    padding: 10px 12px;
    border-radius: 12px;
    border: 1px solid rgba(5,150,105,0.2);
    background: #f8fbf9;
    font: inherit;
    font-size: 0.9rem;
    box-sizing: border-box;
  }
  .modal input:focus, .modal select:focus {
    outline: none;
    border-color: #059669;
    background: #fff;
  }
  .modal-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-start;
    margin-top: 18px;
  }
  .msg {
    margin-top: 12px;
    padding: 10px 12px;
    border-radius: 12px;
    font-size: 0.88rem;
    display: none;
  }
  .msg.show { display: block; }
  .msg.err { background: rgba(161,61,47,0.08); color: #a13d2f; border: 1px solid rgba(161,61,47,0.2); }
  .msg.ok { background: rgba(5,150,105,0.1); color: #047857; border: 1px solid rgba(5,150,105,0.2); }
  .empty { color: #7a9e90; padding: 24px; text-align: center; }
</style>
</head>
<body class="users-page">
  <div class="users-shell">
    <div class="users-top">
      <div>
        <h1 id="page-title">مدیریت کاربران و سطح‌بندی</h1>
        <div id="page-subtitle" style="color:#5a7a6d;font-size:0.9rem;margin-top:4px;">تعیین سطوح دسترسی (سطح ۳: ۵ پیام کل، سطح ۲: ۱۰ پیام روزانه، سطح ۱: نامحدود، مدیر) و نظارت بر مصرف</div>
      </div>
      <div class="users-actions">
        <a class="ghost-btn tiny" id="btn-back" href="/app">بازگشت به برنامه</a>
        <button class="ghost-btn tiny" id="btn-lang" type="button" title="Switch Language">EN</button>
        <button class="primary-btn tiny" id="btn-add" type="button">افزودن کاربر</button>
        <button class="ghost-btn tiny" id="btn-logout" type="button">خروج</button>
      </div>
    </div>

    <div class="users-card">
      <div id="users-msg" class="msg"></div>
      <div id="users-empty" class="empty" hidden>هنوز کاربری ثبت نشده است.</div>
      <div style="overflow-x:auto;">
        <table class="users-table" id="users-table" hidden>
          <thead>
            <tr>
              <th id="th-display">نام نمایشی</th>
              <th id="th-username">نام کاربری</th>
              <th id="th-email">ایمیل</th>
              <th id="th-mobile">موبایل</th>
              <th id="th-role">نقش سیستم</th>
              <th id="th-tier">سطح کاربری</th>
              <th id="th-usage">میزان مصرف</th>
              <th id="th-status">وضعیت</th>
              <th id="th-actions">عملیات</th>
            </tr>
          </thead>
          <tbody id="users-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="modal-back" id="user-modal">
    <div class="modal">
      <h2 id="modal-title">افزودن کاربر</h2>
      <form id="user-form">
        <input type="hidden" id="user-id" />
        <label for="f-display" id="lbl-display">نام و نام خانوادگی</label>
        <input id="f-display" type="text" required placeholder="مثلاً علی رضایی" />

        <label for="f-username" id="lbl-username">نام کاربری</label>
        <input id="f-username" type="text" required placeholder="username" autocomplete="off" />

        <label for="f-email" id="lbl-email">آدرس ایمیل</label>
        <input id="f-email" type="email" placeholder="user@example.com" />

        <label for="f-mobile" id="lbl-mobile">شماره موبایل</label>
        <input id="f-mobile" type="text" placeholder="0912xxxxxxx" />

        <label for="f-password"><span id="lbl-pwd-text">رمز عبور</span> <span id="pwd-hint" style="font-weight:400;color:#7a9e90;">(الزامی)</span></label>
        <input id="f-password" type="password" placeholder="رمز عبور" autocomplete="new-password" />

        <label for="f-tier" id="lbl-tier">سطح کاربری</label>
        <select id="f-tier">
          <option id="opt-tier3" value="tier3">کاربر سطح ۳ (محدود به ۵ پیام در کل — پیش‌فرض ثبت‌نام)</option>
          <option id="opt-tier2" value="tier2">کاربر سطح ۲ (محدود به ۱۰ پیام در روز)</option>
          <option id="opt-tier1" value="tier1">کاربر سطح ۱ (نامحدود)</option>
        </select>

        <label for="f-role" id="lbl-role">نقش سیستمی</label>
        <select id="f-role">
          <option id="opt-role-user" value="user">کاربر عادی</option>
          <option id="opt-role-admin" value="admin">مدیر سیستم (دسترسی کامل و مدیریت کاربران)</option>
        </select>

        <label for="f-active" id="active-wrap" hidden>
          <span id="lbl-active">وضعیت حساب</span>
          <select id="f-active">
            <option id="opt-active-true" value="true">فعال</option>
            <option id="opt-active-false" value="false">غیرفعال</option>
          </select>
        </label>

        <div class="modal-actions">
          <button type="submit" class="primary-btn tiny" id="btn-save">ذخیره اطلاعات</button>
          <button type="button" class="ghost-btn tiny" id="btn-cancel">انصراف</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/static/users.js"></script>
</body>
</html>
