<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>مدیریت کاربران — Rayamate</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css" />
<style>
  body.users-page {
    font-family: 'Vazirmatn', var(--font-rtl), sans-serif;
    background: #f4f8f6;
    margin: 0;
    min-height: 100vh;
  }
  .users-shell {
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px 18px 40px;
  }
  .users-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .users-top h1 {
    margin: 0;
    font-size: 1.45rem;
    color: #0f2a1f;
  }
  .users-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .users-card {
    background: #fff;
    border: 1px solid rgba(5,150,105,0.14);
    border-radius: 18px;
    box-shadow: 0 16px 40px rgba(5,150,105,0.08);
    padding: 18px;
  }
  .users-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.92rem;
  }
  .users-table th, .users-table td {
    text-align: right;
    padding: 12px 10px;
    border-bottom: 1px solid rgba(5,150,105,0.1);
  }
  .users-table th {
    color: #047857;
    font-size: 0.82rem;
    font-weight: 700;
  }
  .badge {
    display: inline-flex;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 700;
  }
  .badge-admin { background: rgba(5,150,105,0.12); color: #047857; }
  .badge-user { background: rgba(15,42,31,0.06); color: #4a6b5e; }
  .badge-off { background: rgba(161,61,47,0.1); color: #a13d2f; }
  .badge-on { background: rgba(5,150,105,0.12); color: #047857; }
  .row-btns { display: flex; gap: 6px; flex-wrap: wrap; }
  .ghost-btn.tiny, .primary-btn.tiny {
    width: auto;
    padding: 6px 10px;
    font-size: 0.8rem;
    border-radius: 10px;
  }
  .primary-btn.tiny { background: #059669; color: #fff; border: none; }
  .ghost-btn.tiny.danger { color: #a13d2f; border-color: rgba(161,61,47,0.3); }
  .modal-back {
    position: fixed; inset: 0;
    background: rgba(15,42,31,0.35);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 16px;
  }
  .modal-back.open { display: flex; }
  .modal {
    width: min(480px, 100%);
    background: #fff;
    border-radius: 18px;
    padding: 22px;
    border: 1px solid rgba(5,150,105,0.14);
  }
  .modal h2 { margin: 0 0 14px; font-size: 1.15rem; color: #0f2a1f; }
  .modal label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    color: #315749;
    margin: 10px 0 6px;
  }
  .modal input, .modal select {
    width: 100%;
    padding: 10px 12px;
    border-radius: 12px;
    border: 1px solid rgba(5,150,105,0.2);
    background: #f8fbf9;
    font: inherit;
  }
  .modal-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-start;
    margin-top: 16px;
  }
  .msg {
    margin-top: 12px;
    padding: 10px 12px;
    border-radius: 12px;
    font-size: 0.88rem;
    display: none;
  }
  .msg.show { display: block; }
  .msg.err { background: rgba(161,61,47,0.08); color: #a13d2f; border: 1px solid rgba(161,61,47,0.2); }
  .msg.ok { background: rgba(5,150,105,0.1); color: #047857; border: 1px solid rgba(5,150,105,0.2); }
  .empty { color: #7a9e90; padding: 24px; text-align: center; }
</style>
</head>
<body class="users-page">
  <div class="users-shell">
    <div class="users-top">
      <div>
        <h1>مدیریت کاربران</h1>
        <div style="color:#5a7a6d;font-size:0.9rem;margin-top:4px;">فقط مدیر سیستم به این بخش دسترسی دارد</div>
      </div>
      <div class="users-actions">
        <a class="ghost-btn tiny" href="/app">بازگشت به برنامه</a>
        <button class="primary-btn tiny" id="btn-add" type="button">افزودن کاربر</button>
        <button class="ghost-btn tiny" id="btn-logout" type="button">خروج</button>
      </div>
    </div>

    <div class="users-card">
      <div id="users-msg" class="msg"></div>
      <div id="users-empty" class="empty" hidden>هنوز کاربری ثبت نشده است.</div>
      <div style="overflow-x:auto;">
        <table class="users-table" id="users-table" hidden>
          <thead>
            <tr>
              <th>نام نمایشی</th>
              <th>نام کاربری</th>
              <th>موبایل</th>
              <th>نقش</th>
              <th>وضعیت</th>
              <th>عملیات</th>
            </tr>
          </thead>
          <tbody id="users-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="modal-back" id="user-modal">
    <div class="modal">
      <h2 id="modal-title">افزودن کاربر</h2>
      <form id="user-form">
        <input type="hidden" id="user-id" />
        <label for="f-display">نام نمایشی</label>
        <input id="f-display" type="text" required placeholder="مثلاً علی رضایی" />

        <label for="f-username">نام کاربری</label>
        <input id="f-username" type="text" required placeholder="username" autocomplete="off" />

        <label for="f-mobile">موبایل</label>
        <input id="f-mobile" type="text" placeholder="0912xxxxxxx" />

        <label for="f-password">رمز عبور <span id="pwd-hint" style="font-weight:400;color:#7a9e90;">(الزامی)</span></label>
        <input id="f-password" type="password" placeholder="رمز عبور" autocomplete="new-password" />

        <label for="f-role">نقش</label>
        <select id="f-role">
          <option value="user">کاربر</option>
          <option value="admin">مدیر</option>
        </select>

        <label for="f-active" id="active-wrap" hidden>
          وضعیت
          <select id="f-active">
            <option value="true">فعال</option>
            <option value="false">غیرفعال</option>
          </select>
        </label>

        <div class="modal-actions">
          <button type="submit" class="primary-btn tiny" id="btn-save">ذخیره</button>
          <button type="button" class="ghost-btn tiny" id="btn-cancel">انصراف</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/static/users.js"></script>
</body>
</html>
