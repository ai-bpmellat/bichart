<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ورود — Rayamate رایامیت</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css" />
</head>
<body class="theme-rayamate">

<div class="login-gate">
  <div class="login-card">
    <div class="login-watermark" aria-hidden="true">
      <span>Rayamate</span>
      <span>رایامیت</span>
    </div>

    <div class="login-card-content">
      <div class="brand-mark">RAYAMATE · BI</div>
      <h1>ورود به دستیار هوش تجاری</h1>
      <p class="login-sub">برای دسترسی به گزارش‌های گفتگویی، نام کاربری و رمز عبور خود را وارد کنید.</p>

      <form id="login-form" novalidate>
        <label class="field-label" for="username-input">نام کاربری</label>
        <input id="username-input" class="login-input" type="text" name="username" autocomplete="username" required placeholder="نام کاربری" />

        <label class="field-label" for="password-input">رمز عبور</label>
        <input id="password-input" class="login-input" type="password" name="password" autocomplete="current-password" required placeholder="رمز عبور" />

        <label class="captcha-box" for="captcha-input">
          <input id="captcha-input" type="checkbox" name="captcha" />
          <span class="captcha-tick" aria-hidden="true"></span>
          <span class="captcha-text">من ربات نیستم</span>
          <span class="captcha-badge">CAPTCHA</span>
        </label>

        <button type="submit" class="primary-btn" id="login-btn">ورود</button>
      </form>

      <div id="login-error" class="login-error" hidden></div>
    </div>
  </div>
</div>

<script src="/static/login.js"></script>
</body>
</html>
