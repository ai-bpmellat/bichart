<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>دستیار هوشمند هوش تجاری به پرداخت ملت</title>
<link rel="stylesheet" href="/static/style.css" />
<script src="/static/vendor/chart.umd.min.js"></script>
</head>
<body>

<div class="app-shell">

  <header class="topbar app-header">
    <h1 class="app-header-title">دستیار هوشمند هوش تجاری به پرداخت ملت</h1>
    <button id="lang-toggle-btn" class="ghost-btn app-header-lang" title="Toggle AI response language">FA</button>
  </header>

  <main class="chat-area" id="chat-area">
    <div class="welcome-block" id="welcome-block">
      <h2>Ask about your transactions</h2>
      <p>Try: <em>"Show top 10 merchants by volume"</em> or <em>"نمایش تراکنش های دیروز"</em></p>
    </div>
  </main>

  <footer class="composer">
    <textarea id="message-input" placeholder="Ask a question about your transactions… (Persian or English)" rows="1"></textarea>
    <button id="send-btn" class="primary-btn">Send</button>
  </footer>

</div>

<script src="/static/script.js"></script>
</body>
</html>
